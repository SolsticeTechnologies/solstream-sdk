name: Deploy to EC2

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: SSH & restart monitors
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d ~/solstream-sdk-internal ]; then
              git clone https://github.com/SolsticeTechnologies/solstream-sdk.git ~/solstream-sdk
            fi
            cd ~/solstream-sdk
            git pull origin dev
            docker compose up --build -d
            docker compose ps
