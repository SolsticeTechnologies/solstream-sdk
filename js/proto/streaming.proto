syntax = "proto3";

import "google/protobuf/timestamp.proto";

package streaming;

service StreamingService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeUpdate);
  rpc SubscribeBlocks(SubscribeBlockRequest) returns (stream SubscribeBlockUpdate);
}

// ---------- Account Data ----------

message AccountInfo {
  bytes pubkey = 1;
  uint64 slot = 2;
  uint64 lamports = 3;
  bytes owner = 4;
  bool executable = 5;
  uint64 rent_epoch = 6;
  bytes data = 7;
  uint64 write_version = 8;
  bool is_startup = 9;
  uint32 version = 10;
}

// ---------- Transaction Data ----------

message TransactionInfo {
  bytes signature = 1;
  uint64 slot = 2;
  bytes message_hash = 3;
  bool is_vote = 4;
  Transaction transaction = 5;
  TransactionStatusMeta transaction_meta = 6;
  optional uint64 index = 7;
}

message Transaction {
    repeated bytes signatures = 1;
    Message message = 2;
}

message Message {
    MessageHeader header = 1;
    repeated bytes account_keys = 2;
    bytes recent_blockhash = 3;
    repeated CompiledInstruction instructions = 4;
    bool versioned = 5;
    repeated MessageAddressTableLookup address_table_lookups = 6;
}

message MessageHeader {
    uint32 num_required_signatures = 1;
    uint32 num_readonly_signed_accounts = 2;
    uint32 num_readonly_unsigned_accounts = 3;
}

message MessageAddressTableLookup {
    bytes account_key = 1;
    bytes writable_indexes = 2;
    bytes readonly_indexes = 3;
}

message TransactionStatusMeta {
    TransactionError err = 1;
    uint64 fee = 2;
    repeated uint64 pre_balances = 3;
    repeated uint64 post_balances = 4;
    repeated InnerInstructions inner_instructions = 5;
    repeated string log_messages = 6;
    repeated TokenBalance pre_token_balances = 7;
    repeated TokenBalance post_token_balances = 8;
    repeated Reward rewards = 9;
    repeated bytes loaded_writable_addresses = 10;
    repeated bytes loaded_readonly_addresses = 11;
    ReturnData return_data = 12;
    optional uint64 compute_units_consumed = 13;
    optional uint64 cost_units = 14;
}

message TransactionError {
    bytes err = 1;
}

message InnerInstructions {
    uint32 index = 1;
    repeated InnerInstruction instructions = 2;
}

message InnerInstruction {
    CompiledInstruction instruction = 1;
    optional uint32 stack_height = 2;
}

message CompiledInstruction {
    uint32 program_id_index = 1;
    bytes accounts = 2;
    bytes data = 3;
}

message TokenBalance {
    uint32 account_index = 1;
    string mint = 2;
    UiTokenAmount ui_token_amount = 3;
    string owner = 4;
    string program_id = 5;
}

message UiTokenAmount {
    optional double ui_amount = 1;
    uint32 decimals = 2;
    string amount = 3;
    string ui_amount_string = 4;
}

message ReturnData {
    bytes program_id = 1;
    bytes data = 2;
}

// ---------- Block / Slot / Entry Data ----------

message BlockInfo {
  uint64 slot = 1;
  optional uint64 parent_slot = 2;
  optional string parent_blockhash = 3;
  string blockhash = 4;
  repeated Reward rewards = 5;
  optional int64 block_time = 6;
  optional uint64 block_height = 7;
  optional uint64 executed_transaction_count = 8;
  optional uint64 entry_count = 9;
  uint32 version = 10;
}

message Reward {
  string pubkey = 1;
  int64 lamports = 2;
  uint64 post_balance = 3;
  RewardType reward_type = 4;
  optional uint32 commission = 5;
}

enum RewardType {
  Unspecified = 0;
  Fee = 1;
  Rent = 2;
  Staking = 3;
  Voting = 4;
}

message SlotInfo {
  uint64 slot = 1;
  optional uint64 parent = 2;
  SlotStatus status = 3;
}

enum SlotStatus {
    Unknown = 0;
    Processed = 1;
    Rooted = 2;
    Confirmed = 3;
    FirstShredReceived = 4;
    Completed = 5;
    CreatedBank = 6;
    Dead = 7;
}

message EntryInfo {
  uint64 slot = 1;
  uint64 index = 2;
  uint64 num_hashes = 3;
  bytes hash = 4;
  uint64 executed_transaction_count = 5;
  uint64 starting_transaction_index = 6;
}

enum CommitmentLevel {
  PROCESSED = 0;
  CONFIRMED = 1;
  FINALIZED = 2;
}

message SubscribeRequest {
  string client_id = 1;

  map<string, SubscribeRequestFilterAccounts> accounts = 2;
  map<string, SubscribeRequestFilterSlots> slots = 3;
  map<string, SubscribeRequestFilterTransactions> transactions = 4;

  optional CommitmentLevel commitment = 5;
  optional uint64 from_slot = 6;
  optional bool include_block_infos = 7;
  optional bool include_entries = 8;
  repeated SubscribeRequestAccountsDataSlice accounts_data_slice = 9;
}

message SubscribeBlockRequest {
  string client_id = 1;

  repeated string account_include = 2;
  optional bool include_transactions = 3;
  optional bool include_accounts = 4;
  optional bool include_entries = 5;

  optional uint64 from_slot = 6;
}

message SubscribeRequestFilterAccounts {
  repeated string account = 1;
  repeated string owner = 2;
  repeated SubscribeRequestFilterAccountsFilter filters = 3;
  optional bool nonempty_txn_signature = 4;
}

message SubscribeRequestFilterAccountsFilter {
  oneof filter {
    SubscribeRequestFilterAccountsFilterMemcmp memcmp = 1;
    uint64 datasize = 2;
    bool token_account_state = 3;
    SubscribeRequestFilterAccountsFilterLamports lamports = 4;
  }
}

message SubscribeRequestFilterAccountsFilterMemcmp {
  uint64 offset = 1;
  oneof data {
    bytes bytes = 2;
    string base58 = 3;
    string base64 = 4;
  }
}

message SubscribeRequestFilterAccountsFilterLamports {
  oneof cmp {
    uint64 eq = 1;
    uint64 ne = 2;
    uint64 lt = 3;
    uint64 gt = 4;
  }
}

message SubscribeRequestFilterSlots {
  optional bool filter_by_commitment = 1;
}

message SubscribeRequestFilterTransactions {
  optional bool vote = 1;
  optional bool failed = 2;
  optional string signature = 3;
  repeated string account_include = 4;
  repeated string account_exclude = 5;
  repeated string account_required = 6;
}

message SubscribeRequestAccountsDataSlice {
  uint64 offset = 1;
  uint64 length = 2;
}

message SubscribeUpdate {
  repeated string filters = 1;
  oneof update {
    SubscribeUpdateAccount account = 2;
    SubscribeUpdateSlot slot = 3;
    SubscribeUpdateTransaction transaction = 4;
    SubscribeUpdateBlockMeta block_meta = 5;
    SubscribeUpdateEntry entry = 6;
  }
  google.protobuf.Timestamp created_at = 7;
}

message SubscribeUpdateAccount {
  AccountInfo account = 1;
  uint64 slot = 2;
  bool is_startup = 3;
}

message SubscribeUpdateSlot {
  SlotInfo slot_info = 1;
}

message SubscribeUpdateTransaction {
  TransactionInfo transaction = 1;
  uint64 slot = 2;
}

message SubscribeBlockUpdate {
  BlockInfo block = 1;
  uint64 updated_account_count = 2;
  repeated AccountInfo accounts = 3;
  repeated TransactionInfo transactions = 4;
  repeated EntryInfo entries = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SubscribeUpdateBlockMeta {
  BlockInfo block_info = 1;
}

message SubscribeUpdateEntry {
  EntryInfo entry = 1;
}
