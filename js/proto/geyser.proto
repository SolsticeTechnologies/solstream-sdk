syntax = "proto3";

package geyser;

// Core account information as stored by the Geyser plugin
message AccountInfo {
  bytes pubkey = 1;
  uint64 lamports = 2;
  bytes owner = 3;
  bool executable = 4;
  uint64 rent_epoch = 5;
  bytes data = 6;
  uint64 write_version = 7;
  optional bytes txn_signature = 8;
}

// Slot status update
message SlotInfo {
  uint64 slot = 1;
  optional uint64 parent = 2;
  SlotStatus status = 3;
  optional string dead_error = 4;
}

enum SlotStatus {
  SLOT_STATUS_PROCESSED = 0;
  SLOT_STATUS_CONFIRMED = 1;
  SLOT_STATUS_FINALIZED = 2;
  SLOT_STATUS_FIRST_SHRED_RECEIVED = 3;
  SLOT_STATUS_COMPLETED = 4;
  SLOT_STATUS_CREATED_BANK = 5;
  SLOT_STATUS_DEAD = 6;
  SLOT_STATUS_ROOTED = 7;
  SLOT_STATUS_OPTIMISTICALLY_CONFIRMED = 8;
}

// Transaction as seen by the validator
message TransactionInfo {
  bytes signature = 1;
  bool is_vote = 2;
  Transaction transaction = 3;
  TransactionStatusMeta meta = 4;
  uint64 index = 5;
}

// Block-level metadata
message BlockInfo {
  uint64 slot = 1;
  string blockhash = 2;
  repeated Reward rewards = 3;
  optional int64 block_time = 4;
  optional uint64 block_height = 5;
  optional uint64 executed_transaction_count = 6;
  optional uint64 entries_count = 7;
  optional uint64 total_transaction_count = 8;
}

// A single ledger entry (tick or transaction batch)
message EntryInfo {
  uint64 slot = 1;
  uint64 index = 2;
  uint64 num_hashes = 3;
  bytes hash = 4;
  uint64 executed_transaction_count = 5;
  uint64 starting_transaction_index = 6;
}

// ─────────────────────────────────────────────────────────────────────────────
// Transaction structures
// ─────────────────────────────────────────────────────────────────────────────

message Transaction {
  repeated bytes signatures = 1;
  Message message = 2;
}

message Message {
  MessageHeader header = 1;
  repeated bytes account_keys = 2;
  bytes recent_blockhash = 3;
  repeated CompiledInstruction instructions = 4;
  bool versioned = 5;
  repeated MessageAddressTableLookup address_table_lookups = 6;
}

message MessageHeader {
  uint32 num_required_signatures = 1;
  uint32 num_readonly_signed_accounts = 2;
  uint32 num_readonly_unsigned_accounts = 3;
}

message MessageAddressTableLookup {
  bytes account_key = 1;
  bytes writable_indexes = 2;
  bytes readonly_indexes = 3;
}

message CompiledInstruction {
  uint32 program_id_index = 1;
  bytes accounts = 2;
  bytes data = 3;
}

message InnerInstructions {
  uint32 index = 1;
  repeated InnerInstruction instructions = 2;
}

message InnerInstruction {
  uint32 program_id_index = 1;
  bytes accounts = 2;
  bytes data = 3;
  optional uint32 stack_height = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Transaction metadata
// ─────────────────────────────────────────────────────────────────────────────

message TransactionStatusMeta {
  optional TransactionError err = 1;
  uint64 fee = 2;
  repeated uint64 pre_balances = 3;
  repeated uint64 post_balances = 4;
  repeated InnerInstructions inner_instructions = 5;
  bool inner_instructions_none = 6;
  repeated string log_messages = 7;
  bool log_messages_none = 8;
  repeated TokenBalance pre_token_balances = 9;
  repeated TokenBalance post_token_balances = 10;
  repeated Reward rewards = 11;
  bool rewards_none = 12;
  repeated bytes loaded_writable_addresses = 13;
  repeated bytes loaded_readonly_addresses = 14;
  optional ReturnData return_data = 15;
  bool return_data_none = 16;
  optional uint64 compute_units_consumed = 17;
}

message TransactionError {
  bytes err = 1;
}

message ReturnData {
  bytes program_id = 1;
  bytes data = 2;
}

message TokenBalance {
  uint32 account_index = 1;
  string mint = 2;
  UiTokenAmount ui_token_amount = 3;
  string owner = 4;
  string program_id = 5;
}

message UiTokenAmount {
  double ui_amount = 1;
  uint32 decimals = 2;
  string amount = 3;
  string ui_amount_string = 4;
}

// ─────────────────────────────────────────────────────────────────────────────
// Rewards
// ─────────────────────────────────────────────────────────────────────────────

message Reward {
  string pubkey = 1;
  int64 lamports = 2;
  uint64 post_balance = 3;
  RewardType reward_type = 4;
  string commission = 5;
}

enum RewardType {
  Unspecified = 0;
  Fee = 1;
  Rent = 2;
  Staking = 3;
  Voting = 4;
}
